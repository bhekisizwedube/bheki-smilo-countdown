<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bheki & Smiloe Countdown</title>

<style>
:root {
  color-scheme: light dark;
  --bg: light-dark(#fff7fa, #171413);
  --text: light-dark(#302724, #f6eee9);
  --muted: light-dark(#796b65, #bfb1aa);
  --line: light-dark(#ead5df, #3c322e);
  --accent: light-dark(#9bbbd6, #d7b9aa);
  --pink: light-dark(#f7dce7, #4a303a);
  --blue: light-dark(#dcecf7, #263b4a);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  font-family: Georgia, "Times New Roman", serif;
  background: var(--bg);
  color: var(--text);
}

#app {
  min-height: 100vh;
  background-color: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px;
  border-radius: 0;
  text-align: center;
}

.wrap {
  width: min(900px, 100%);
  padding: 36px 18px;
}

.eyebrow {
  font: 600 11px/1.2 Arial, sans-serif;
  letter-spacing: .28em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 18px;
}

.names {
  font-size: clamp(32px, 6vw, 64px);
  font-weight: 400;
  letter-spacing: .02em;
  margin: 0;
}

.amp {
  font-style: italic;
  color: var(--accent);
}

.rule {
  width: 54px;
  height: 1px;
  background: var(--line);
  margin: 24px auto 28px;
}

.intro {
  font-size: clamp(16px, 2.4vw, 20px);
  font-style: italic;
  color: var(--muted);
  margin: 0 0 28px;
}

.date {
  font: 600 12px/1.4 Arial, sans-serif;
  letter-spacing: .18em;
  text-transform: uppercase;
  margin-bottom: 28px;
}

.countdown {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  max-width: 760px;
  margin: auto;
}

.unit {
  padding: 18px 8px;
  border: 1px solid var(--line);
  background: linear-gradient(135deg, var(--pink), var(--blue));
}

.num {
  font-size: clamp(34px, 7vw, 62px);
  line-height: 1;
  font-weight: 400;
}

.label {
  margin-top: 9px;
  font: 600 10px/1.2 Arial, sans-serif;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--muted);
}

.message {
  margin-top: 30px;
  font-size: 16px;
  font-style: italic;
  color: var(--muted);
}

@media (max-width: 520px) {
  #app {
    padding: 18px;
  }

  .wrap {
    padding: 26px 4px;
  }

  .countdown {
    gap: 6px;
  }

  .unit {
    padding: 16px 4px;
  }

  .label {
    font-size: 8px;
    letter-spacing: .12em;
  }
}
</style>
</head>

<body>

<main id="app">
  <section class="wrap" aria-label="Wedding countdown">

    <div class="eyebrow">
      Our wedding day
    </div>

    <h1 class="names">
      Bheki <span class="amp">&amp;</span> Smiloe
    </h1>

    <div class="rule"></div>

    <p class="intro">
      Counting down to the day we say “I do”
    </p>

    <div class="date">
      20 December 2026
    </div>

    <div class="countdown" id="countdown">

      <div class="unit">
        <div class="num" id="days">0</div>
        <div class="label">Days</div>
      </div>

      <div class="unit">
        <div class="num" id="hours">0</div>
        <div class="label">Hours</div>
      </div>

      <div class="unit">
        <div class="num" id="minutes">0</div>
        <div class="label">Minutes</div>
      </div>

      <div class="unit">
        <div class="num" id="seconds">0</div>
        <div class="label">Seconds</div>
      </div>

    </div>

    <div class="message" id="message">
      Our forever starts here. ❤️
    </div>

  </section>
</main>

<script>

const target =
  new Date('2026-12-20T00:01:00+02:00').getTime();

const $ = id => document.getElementById(id);

function tick() {

  const diff = target - Date.now();

  if (diff <= 0) {

    ['days', 'hours', 'minutes', 'seconds']
      .forEach(id => $(id).textContent = '0');

    $('message').textContent =
      'Today is the day! ❤️';

    return;
  }

  const s = Math.floor(diff / 1000);

  const d = Math.floor(s / 86400);

  const h = Math.floor(
    (s % 86400) / 3600
  );

  const m = Math.floor(
    (s % 3600) / 60
  );

  const sec = s % 60;

  $('days').textContent = d;

  $('hours').textContent =
    String(h).padStart(2, '0');

  $('minutes').textContent =
    String(m).padStart(2, '0');

  $('seconds').textContent =
    String(sec).padStart(2, '0');
}

tick();

setInterval(tick, 1000);

</script>

</body>
</html>
